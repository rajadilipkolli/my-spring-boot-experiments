cache.timeout-seconds=60
cache.cacheExpirations.myControlledCache=180

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=60s
spring.data.redis.lettuce.pool.test-on-borrow=true

spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=WHEN_AUTHORIZED
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.export.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s


# Prometheus metrics
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.redis.operation=true

# Redis monitoring interval in milliseconds (default: 30 seconds)
redis.monitor.interval=60000
