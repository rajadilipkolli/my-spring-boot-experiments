# Production profile properties (activate with --spring.profiles.active=production)
spring.threads.virtual.enabled=true

# Redis production tuning
spring.data.redis.client-type=lettuce
spring.data.redis.host=redis
spring.data.redis.port=6379
# Server tuning hints
server.max-http-request-header-size=16384
server.tomcat.threads.max=100000
server.tomcat.connection-timeout=20000

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

# DataSource (PostgreSQL)


# Lettuce pool (production tuning)
spring.data.redis.lettuce.pool.max-active=2048
spring.data.redis.lettuce.pool.max-wait=1s
spring.data.redis.lettuce.pool.max-idle=1024
spring.data.redis.lettuce.pool.min-idle=50

# JVM production hints (set in container or systemd service)
# Recommended flags: -XX:+UseZGC -Xms1g -Xmx2g -XX:+UseCompressedOops -XX:MaxDirectMemorySize=512m

# Broker Durability
app.kafka.events-topic.partitions=32
app.kafka.events-topic.replication-factor=3
app.kafka.posts-aggregates-topic.partitions=32
app.kafka.posts-aggregates-topic.replication-factor=3
app.kafka.authors-aggregates-topic.partitions=32
app.kafka.authors-aggregates-topic.replication-factor=3
app.kafka.post-comments-aggregates-topic.partitions=32
app.kafka.post-comments-aggregates-topic.replication-factor=3
app.kafka.min-insync-replicas=2

# Security prerequisites (to be provided via environment variables in production)
# spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
# spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
