name: boot-high-rps-sample
services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - metrics-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://appuser:secret@host.docker.internal:5432/statsdb?sslmode=disable
    volumes:
      - ./postgres_exporter.yml:/postgres_exporter.yml:ro
    networks:
      - metrics-network

  grafana-lgtm:
    image: grafana/otel-lgtm:0.39.0
    extra_hosts: ['host.docker.internal:host-gateway']
    container_name: grafana-lgtm
    profiles:
      - monitoring
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=500
    ports:
      - "3000:3000" # Grafana UI
      - "3200:3200" # OTLP HTTP receiver for logs
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "9090:9090" # Prometheus metrics endpoint
    volumes:
      - ./prometheus.yml:/otel-lgtm/prometheus/prometheus.yml:ro
    networks:
      - metrics-network

networks:
  metrics-network:
    name: metrics-network
    driver: bridge
