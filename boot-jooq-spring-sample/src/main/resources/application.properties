spring.application.name=boot-jooq-spring-sample
server.port=8080
server.shutdown=graceful
spring.jmx.enabled=false
spring.mvc.problemdetails.enabled=true
spring.threads.virtual.enabled=true

################ Database #####################
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.pool-name=HikariPool-${spring.application.name}

################ Liquibase #####################
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
