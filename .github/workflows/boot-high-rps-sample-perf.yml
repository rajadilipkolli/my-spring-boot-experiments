name: boot-high-rps-sample-perf

on:
  push:
    branches: [main]
    paths:
      - "boot-high-rps-sample/**"
  workflow_dispatch:
    inputs:
      profile:
        description: 'Load Profile (normal, high, stress)'
        required: true
        default: 'high'
      durationMinutes:
        description: 'Duration (minutes)'
        required: false
        default: '15'
      targetRps:
        description: 'Target RPS (if overriding profile default)'
        required: false
      postUpdateWeight:
        description: 'Post update operation weight'
        required: false
        default: '1.0'
      postDeleteWeight:
        description: 'Post delete operation weight'
        required: false
        default: '1.0'
      commentUpdateWeight:
        description: 'Comment update operation weight'
        required: false
        default: '1.0'
      commentDeleteWeight:
        description: 'Comment delete operation weight'
        required: false
        default: '1.0'

permissions:
  contents: write

jobs:
  performance-comparison:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boot-high-rps-sample

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: "temurin"
          cache: "maven"

      - name: Setup Profile Inputs
        id: config
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'high' }}
          DURATION_INPUT: ${{ github.event.inputs.durationMinutes || '15' }}
          TARGET_RPS_INPUT: ${{ github.event.inputs.targetRps }}
          POST_UPDATE_WEIGHT: ${{ github.event.inputs.postUpdateWeight || '1.0' }}
          POST_DELETE_WEIGHT: ${{ github.event.inputs.postDeleteWeight || '1.0' }}
          COMMENT_UPDATE_WEIGHT: ${{ github.event.inputs.commentUpdateWeight || '1.0' }}
          COMMENT_DELETE_WEIGHT: ${{ github.event.inputs.commentDeleteWeight || '1.0' }}
        run: |
          case "$PROFILE_INPUT" in
            normal|high|stress) ;;
            *) echo "::error::profile must be one of: normal, high, stress"; exit 1 ;;
          esac

          if [[ ! "$DURATION_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::durationMinutes must be a positive integer"
            exit 1
          fi

          if [[ -n "$TARGET_RPS_INPUT" && ! "$TARGET_RPS_INPUT" =~ ^([1-9][0-9]*([.][0-9]+)?|0[.][0-9]*[1-9][0-9]*)$ ]]; then
            echo "::error::targetRps must be a positive number"
            exit 1
          fi
          printf 'PROFILE=%s\n' "$PROFILE_INPUT" >> "$GITHUB_ENV"
          printf 'DURATION=%s\n' "$DURATION_INPUT" >> "$GITHUB_ENV"
          printf 'TARGET_RPS=%s\n' "$TARGET_RPS_INPUT" >> "$GITHUB_ENV"
          printf 'POST_UPDATE_WEIGHT=%s\n' "$POST_UPDATE_WEIGHT" >> "$GITHUB_ENV"
          printf 'POST_DELETE_WEIGHT=%s\n' "$POST_DELETE_WEIGHT" >> "$GITHUB_ENV"
          printf 'COMMENT_UPDATE_WEIGHT=%s\n' "$COMMENT_UPDATE_WEIGHT" >> "$GITHUB_ENV"
          printf 'COMMENT_DELETE_WEIGHT=%s\n' "$COMMENT_DELETE_WEIGHT" >> "$GITHUB_ENV"

      - name: Run Gatling Tests against HEAD
        run: |
          # We are already on the triggered commit (HEAD)
          set +e
          if [ -n "$TARGET_RPS" ]; then
            pwsh ./scripts/run-gatling-test.ps1 -Profile $PROFILE -DurationMinutes $DURATION -WarmupMinutes 0 -TargetRps "$TARGET_RPS"
          else
            pwsh ./scripts/run-gatling-test.ps1 -Profile $PROFILE -DurationMinutes $DURATION -WarmupMinutes 0
          fi
          GATLING_EXIT_CODE=$?
          set -e
          
          # Save Stats — Gatling 3.13+ no longer emits global_stats.json;
          # extract-stats.py parses the HTML report instead.
          if [[ -d target/gatling ]]; then
            python3 ./scripts/extract-stats.py --out stats.json || true
            mv target/gatling gatling-report
          fi
          
          exit $GATLING_EXIT_CODE

      - name: Collect Diagnostics
        if: ${{ always() }}
        run: |
          python3 ./scripts/collect_diagnostics.py

      - name: Upload Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: performance-diagnostics
          path: boot-high-rps-sample/diagnostics/
          retention-days: 14

      - name: Compare Results
        if: ${{ always() }}
        run: |
          if [ ! -f stats.json ]; then
            echo "## ⚠️ Performance Comparison Skipped" >> $GITHUB_STEP_SUMMARY
            echo "stats.json not found — Gatling did not produce a report." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Possible causes:** app failed to start, data generator failed, or Gatling crashed before generating results." >> $GITHUB_STEP_SUMMARY
            echo "Check the **Run Gatling Tests against HEAD** step logs for details." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ -f docs/baselines/main-baseline-$PROFILE.json ]; then
            pwsh ./scripts/compare-results.ps1 -BaselineStats docs/baselines/main-baseline-$PROFILE.json -NewStats stats.json > comparison.md
            cat comparison.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline found to compare against. This run will establish the first baseline." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gatling Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: boot-high-rps-sample/gatling-report/
          retention-days: 14

      - name: Update baseline on main branch
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/baselines
          cp stats.json docs/baselines/main-baseline-$PROFILE.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/baselines/main-baseline-$PROFILE.json
          if git diff --staged --quiet; then
            echo "Baseline unchanged."
          else
            git commit -m "perf: update performance baseline [skip ci]"
            git push
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
