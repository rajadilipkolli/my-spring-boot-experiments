name: boot-high-rps-sample-perf

on:
  push:
    branches: [main]
    paths:
      - "boot-high-rps-sample/**"
  workflow_dispatch:
    inputs:
      profile:
        description: 'Load Profile (normal, high, stress)'
        required: true
        default: 'normal'
      durationMinutes:
        description: 'Duration (minutes)'
        required: false
        default: '15'
      targetRps:
        description: 'Target RPS (if overriding profile default)'
        required: false
      postUpdateWeight:
        description: 'Post update operation weight'
        required: false
        default: '1.0'
      postDeleteWeight:
        description: 'Post delete operation weight'
        required: false
        default: '1.0'
      commentUpdateWeight:
        description: 'Comment update operation weight'
        required: false
        default: '1.0'
      commentDeleteWeight:
        description: 'Comment delete operation weight'
        required: false
        default: '1.0'

jobs:
  performance-comparison:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boot-high-rps-sample

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: "temurin"
          cache: "maven"

      - name: Setup Profile Inputs
        id: config
        env:
          PROFILE_INPUT: ${{ github.event.inputs.profile || 'normal' }}
          DURATION_INPUT: ${{ github.event.inputs.durationMinutes || '15' }}
          TARGET_RPS_INPUT: ${{ github.event.inputs.targetRps }}
          POST_UPDATE_WEIGHT: ${{ github.event.inputs.postUpdateWeight || '1.0' }}
          POST_DELETE_WEIGHT: ${{ github.event.inputs.postDeleteWeight || '1.0' }}
          COMMENT_UPDATE_WEIGHT: ${{ github.event.inputs.commentUpdateWeight || '1.0' }}
          COMMENT_DELETE_WEIGHT: ${{ github.event.inputs.commentDeleteWeight || '1.0' }}
        run: |
          case "$PROFILE_INPUT" in
            normal|high|stress) ;;
            *) echo "::error::profile must be one of: normal, high, stress"; exit 1 ;;
          esac

          if [[ ! "$DURATION_INPUT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::durationMinutes must be a positive integer"
            exit 1
          fi

          if [[ -n "$TARGET_RPS_INPUT" && ! "$TARGET_RPS_INPUT" =~ ^([1-9][0-9]*([.][0-9]+)?|0[.][0-9]*[1-9][0-9]*)$ ]]; then
            echo "::error::targetRps must be a positive number"
            exit 1
          fi
          printf 'PROFILE=%s\n' "$PROFILE_INPUT" >> "$GITHUB_ENV"
          printf 'DURATION=%s\n' "$DURATION_INPUT" >> "$GITHUB_ENV"
          printf 'TARGET_RPS=%s\n' "$TARGET_RPS_INPUT" >> "$GITHUB_ENV"
          printf 'POST_UPDATE_WEIGHT=%s\n' "$POST_UPDATE_WEIGHT" >> "$GITHUB_ENV"
          printf 'POST_DELETE_WEIGHT=%s\n' "$POST_DELETE_WEIGHT" >> "$GITHUB_ENV"
          printf 'COMMENT_UPDATE_WEIGHT=%s\n' "$COMMENT_UPDATE_WEIGHT" >> "$GITHUB_ENV"
          printf 'COMMENT_DELETE_WEIGHT=%s\n' "$COMMENT_DELETE_WEIGHT" >> "$GITHUB_ENV"
          printf 'CURRENT_HEAD=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Gatling Tests
        run: |
          APP_PID=""
          cleanup() {
            if [[ -n "$APP_PID" ]] && kill -0 "$APP_PID" 2>/dev/null; then
              kill "$APP_PID"
            fi
            docker compose -f docker/docker-compose.yml down -v || true
            if [ -f docker/docker-compose-monitoring.yml ]; then
              docker compose -f docker/docker-compose-monitoring.yml down -v || true
            fi
          }
          trap cleanup EXIT

          # Checkout HEAD
          git checkout "$CURRENT_HEAD"
          
          # Start Infra and Monitoring
          docker compose -f docker/docker-compose.yml up -d
          if [ -f docker/docker-compose-monitoring.yml ]; then
            docker compose -f docker/docker-compose-monitoring.yml up -d
          fi
          
          # Build & Start App
          ./mvnw -DskipTests clean package
          java -jar target/boot-high-rps-sample-0.1.0-SNAPSHOT.jar --spring.profiles.active=local \
            > "$RUNNER_TEMP/head-app.log" 2>&1 &
          APP_PID=$!

          echo "Waiting for /actuator/health to report UP..."
          deadline=$((SECONDS + 120))
          until curl --fail --silent --show-error --max-time 5 http://localhost:8080/actuator/health \
            | grep -q '"status":"UP"'; do
            if (( SECONDS >= deadline )); then
              echo "::error::HEAD application did not become healthy within 120 seconds"
              ps -p "$APP_PID" -f || true
              tail -n 200 "$RUNNER_TEMP/head-app.log" || true
              docker compose -f docker/docker-compose.yml ps || true
              docker compose -f docker/docker-compose.yml logs --no-color --tail=100 || true
              exit 1
            fi
            sleep 2
          done
          
          # Generate Data
          ./mvnw exec:java -Dexec.mainClass="com.example.highrps.gatling.setup.DataGenerator" \
            -Dexec.classpathScope=test -DdataDir=target/loadtest-data -DdataSeed=2674
          
          # Run Gatling
          MAVEN_ARGS=(-Dprofile="$PROFILE" -DdurationMinutes="$DURATION" -DpostUpdateWeight="$POST_UPDATE_WEIGHT" -DpostDeleteWeight="$POST_DELETE_WEIGHT" -DcommentUpdateWeight="$COMMENT_UPDATE_WEIGHT" -DcommentDeleteWeight="$COMMENT_DELETE_WEIGHT")
          if [[ -n "$TARGET_RPS" ]]; then
            MAVEN_ARGS+=(-DtargetRps="$TARGET_RPS")
          fi
          set +e
          ./mvnw gatling:test "${MAVEN_ARGS[@]}"
          GATLING_STATUS=$?
          set -e
         
          # Save Stats
          if [[ -d target/gatling ]]; then
            STATS_FILE=$(find target/gatling -name "stats.json" -print -quit)
            if [[ -n "$STATS_FILE" ]]; then
              cp "$STATS_FILE" ../stats.json
            fi
            mv target/gatling ../gatling-report
          fi

          exit "$GATLING_STATUS"
          
      - name: Compare Results
        if: ${{ always() }}
        run: |
          if [ -f ../docs/baselines/main-baseline.json ]; then
            pwsh scripts/compare-results.ps1 -BaselineStats ../docs/baselines/main-baseline.json -HighRpsStats ../stats.json > comparison.md
            cat comparison.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline found to compare against. This run will establish the first baseline." >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Upload Gatling Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: gatling-report
          path: gatling-report/
          retention-days: 14
          
      - name: Update baseline on main branch
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ../docs/baselines
          cp ../stats.json ../docs/baselines/main-baseline.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ../docs/baselines/main-baseline.json
          if git diff --staged --quiet; then
            echo "Baseline unchanged."
          else
            git commit -m "perf: update performance baseline [skip ci]"
            git push
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
